version: "1.1"

pgg:
  trials: 15
  blocks: 1
  endowment: 10
  group_size: 5
  multiplier: 1.5
  simulated_agents:
    strategy: "conditional_cooperation"
    contribution_range: [0.05, 0.45]
    reference_contribution_ratio: 0.25
    bots:
      - name: "Stable Cooperator"
        base_contribution_ratio: 0.18
        responsiveness: 0.30
      - name: "Reciprocator"
        base_contribution_ratio: 0.20
        responsiveness: 0.55
      - name: "Wait-and-See"
        base_contribution_ratio: 0.12
        responsiveness: 0.70
      - name: "Optimistic Cooperator"
        base_contribution_ratio: 0.26
        responsiveness: 0.40

tutorial:
  trials: 10
  role: "trustee"
  endowment: 10
  multiplier: 3
  sender_investment_schedule: [2, 4, 3, 5, 1, 4, 2, 5, 3, 4]

rtg:
  trials_per_partner: 15
  endowment: 10
  multiplier: 3
  block_order: "randomized"
  partners:
    - name: "High Reciprocity"
      code: 1
      mean_return_rate: [0.45, 0.75]
      contingency_schedule_id: "high-reciprocity-default"
      clamp: [0.0, 1.0]

    - name: "Low Reciprocity"
      code: 2
      mean_return_rate: [0.25, 0.55]
      contingency_schedule_id: "low-reciprocity-default"
      clamp: [0.0, 1.0]

    - name: "Volatile Reciprocity"
      code: 3
      mean_return_rate: [0.25, 0.75]
      contingency_schedule_id: "volatile-uniform-sampled-v2"
      contingency_schedule:
        [
          0.62,
          0.31,
          0.44,
          0.41,
          0.67,
          0.64,
          0.75,
          0.34,
          0.51,
          0.25,
          0.41,
          0.55,
          0.31,
          0.40,
          0.62,
        ]
      clamp: [0.0, 1.0]

post_block_questions:
  enabled: true
  partner_classification_options:
    - "high_return"
    - "low_return"
    - "unpredictable"
  confidence_range: [1, 7]
  willingness_range: [1, 7]
