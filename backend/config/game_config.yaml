version: "1.0"

pgg:
  trials: 15
  blocks: 1
  endowment: 10
  group_size: 5
  multiplier: 1.5
  simulated_agents:
    contribution_range: [0.05, 0.45]
    strategy: "uniform_random"

tutorial:
  trials: 10
  role: "trustee"
  endowment: 10
  multiplier: 3
  sender_investment_schedule: [2, 4, 3, 5, 1, 4, 2, 5, 3, 4]

rtg:
  trials_per_partner: 15
  endowment: 10
  multiplier: 3
  block_order: "randomized"
  partners:
    - name: "High Reciprocity"
      code: 1
      mean_return_rate: [0.60, 0.75]
      volatility_parameter: 0.05
      contingency_schedule_id: "high-reciprocity-default"
      noise_distribution:
        type: "normal"
        mean: 0.0
        sd: 0.05
      clamp: [0.0, 1.0]

    - name: "Low Reciprocity"
      code: 2
      mean_return_rate: [0.10, 0.30]
      volatility_parameter: 0.05
      contingency_schedule_id: "low-reciprocity-default"
      noise_distribution:
        type: "normal"
        mean: 0.0
        sd: 0.05
      clamp: [0.0, 1.0]

    - name: "Volatile Reciprocity"
      code: 3
      mean_return_rate: [0.40, 0.40]
      volatility_parameter: 0.25
      contingency_schedule_id: "volatile-fixed-v1"
      contingency_schedule:
        [
          0.72,
          0.18,
          0.61,
          0.22,
          0.67,
          0.14,
          0.58,
          0.26,
          0.70,
          0.12,
          0.63,
          0.19,
          0.55,
          0.28,
          0.64,
        ]
      noise_distribution:
        type: "normal"
        mean: 0.0
        sd: 0.0
      clamp: [0.0, 1.0]

post_block_questions:
  enabled: true
  partner_classification_options:
    - "high_return"
    - "low_return"
    - "unpredictable"
  confidence_range: [1, 7]
  willingness_range: [1, 7]
