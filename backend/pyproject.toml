[project]
name = "ecoplay"
version = "0.2.0"
description = "EcoPlay Backend API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.12",
    "uvicorn[standard]>=0.34.3",
    "pydantic>=2.11.5",
    "asyncpg>=0.30.0",
    "python-dotenv>=1.1.0",
    "firebase-admin>=6.9.0",
    # 2.35.0 sends Firestore's `(default)` database as `%28default%29`,
    # which the Firestore backend rejects as an invalid database ID.
    "google-api-core[grpc]>=2.30.0,<2.35.0",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "pip-audit>=2.10.0",
    "pytest>=8.4.2",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "db*", "engine*", "routers*", "schemas*", "services*"]
exclude = ["secret*", "tests*"]
